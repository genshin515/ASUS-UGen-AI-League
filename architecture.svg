<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="390" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Desk Posture &amp; Screen-Distance Guard — Architecture</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">Stage I: laptop prototype  ·  Stage II: planned port to ASUS UGen300 (Hailo-10H)</text>

  <!-- boxes -->
  <g stroke="#1d4ed8" stroke-width="1.5" fill="#eff6ff">
    <rect x="20"  y="100" width="160" height="110" rx="10"/>
    <rect x="210" y="100" width="160" height="110" rx="10"/>
    <rect x="400" y="100" width="160" height="110" rx="10"/>
    <rect x="590" y="100" width="160" height="110" rx="10"/>
    <rect x="780" y="100" width="160" height="110" rx="10" fill="#ecfdf5" stroke="#047857"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="100" y="135" font-size="16" font-weight="700">1 · Webcam</text>
    <text x="100" y="164" font-size="13" fill="#334155">OpenCV capture</text>
    <text x="100" y="184" font-size="13" fill="#334155">frames kept in memory</text>

    <text x="290" y="135" font-size="16" font-weight="700">2 · Pose model</text>
    <text x="290" y="164" font-size="13" fill="#334155">YOLOv8n-pose</text>
    <text x="290" y="184" font-size="13" fill="#334155">17 body keypoints</text>

    <text x="480" y="135" font-size="16" font-weight="700">3 · Metrics</text>
    <text x="480" y="164" font-size="13" fill="#334155">head_ratio, eye_ratio</text>
    <text x="480" y="184" font-size="13" fill="#334155">vs. personal baseline</text>

    <text x="670" y="135" font-size="16" font-weight="700">4 · Debounce</text>
    <text x="670" y="164" font-size="13" fill="#334155">bad for ≥ 3 s → alert</text>
    <text x="670" y="184" font-size="13" fill="#334155">60 s cooldown</text>

    <text x="860" y="135" font-size="16" font-weight="700">5 · Local alert</text>
    <text x="860" y="164" font-size="13" fill="#334155">desktop notification</text>
    <text x="860" y="184" font-size="13" fill="#334155">+ on-screen banner</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)">
    <line x1="182" y1="155" x2="208" y2="155"/>
    <line x1="372" y1="155" x2="398" y2="155"/>
    <line x1="562" y1="155" x2="588" y2="155"/>
    <line x1="752" y1="155" x2="778" y2="155"/>
  </g>

  <!-- Stage II swap callout -->
  <line x1="290" y1="212" x2="290" y2="246" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="165" y="248" width="250" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g text-anchor="middle">
    <text x="290" y="270" font-size="14" font-weight="700" fill="#5b21b6">Stage II (planned): UGen300</text>
    <text x="290" y="288" font-size="12" fill="#4c1d95">Hailo-10H · yolov8s_pose.hef</text>
    <text x="290" y="304" font-size="12" fill="#4c1d95">only load_model() / infer() change</text>
  </g>

  <!-- privacy bar -->
  <rect x="20" y="334" width="920" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="357" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Everything runs on-device — no frames or keypoints leave the machine</text>
</svg>
